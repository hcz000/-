server:
  port: 8081

spring:
  application:
    name: user-svc

  threads:
    virtual:
      enabled: true

  # ===== MySQL =====
  datasource:
    url: jdbc:mysql://localhost:3306/knowledgeplanet?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: UserSvcHikariPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # ===== Redis =====
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5s
      client-name: user-svc
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ===== Mail（注册验证码）=====
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:zilvdexiaozheng@qq.com}
    password: ${MAIL_PASSWORD:placeholder}
    protocol: smtps
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  # ===== Spring Cloud =====
  # Nacos 相关配置（server-addr / discovery / config）见 bootstrap.yml

# ===== Sa-Token =====
sa-token:
  token-name: Authorization
  timeout: 900
  active-timeout: 900
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-cookie: false
  is-read-header: true
  is-write-header: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  # ===== 链路追踪 =====
  tracing:
    sampling:
      probability: 1.0          # demo 用 100% 采样，生产建议 0.01~0.1
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# ===== Seata 客户端 =====
# Seata server 是 file 模式（不走 Nacos），直接配 TC 地址
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
    disable-global-transaction: false
  registry:
    type: file
  config:
    type: file
  client:
    rm:
      report-success-enable: false
    tm:
      default-global-transaction-timeout: 60000
  data-source-proxy-mode: AT

logging:
  level:
    com.example.cloud.user: DEBUG

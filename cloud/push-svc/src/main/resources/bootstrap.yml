spring:
  application:
    name: push-svc
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:localhost:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        enabled: true
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        ephemeral: true
      config:
        enabled: false
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        file-extension: yml

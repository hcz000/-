server:
  port: 8083

spring:
  application:
    name: push-svc

  threads:
    virtual:
      enabled: true

  # ===== MySQL（与单体共享同一个数据库，临时方案）=====
  datasource:
    url: jdbc:mysql://localhost:3306/knowledgeplanet?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: PushSvcHikariPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # ===== Redis =====
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5s
      client-name: push-svc
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ===== RabbitMQ（消费 post-svc 的 PostCreatedEvent）=====
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:123456}
    listener:
      simple:
        # 至少一次投递：业务异常 → nack，回队列
        acknowledge-mode: auto
        # 失败重试由消费端自带（spring-retry 默认 3 次），过载/毒消息建议配 DLX
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

  # Nacos 相关配置见 bootstrap.yml

  # ===== OpenFeign（调 user-svc 等下游服务）=====
  cloud:
    openfeign:
      client:
        config:
          # 默认配置
          default:
            connect-timeout: 3000
            read-timeout: 5000
          # 调 user-svc 的专用配置（更严格的超时）
          user-svc:
            connect-timeout: 1000
            read-timeout: 1000
            logger-level: BASIC
      # 把 Feign 包装进 CircuitBreaker（让 Feign 异常能触发 @CircuitBreaker）
      circuitbreaker:
        enabled: true

# Sa-Token：与 user-svc 共享同一份配置，token 校验通过 Redis 中共享的会话
sa-token:
  token-name: Authorization
  timeout: 900
  active-timeout: 900
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-read-cookie: false
  is-read-header: true
  is-write-header: true

# 当前激活的推荐策略（与单体保持一致）
app:
  recommend:
    strategy: interestStrategy

# ===== Resilience4j 熔断器 =====
resilience4j:
  circuitbreaker:
    instances:
      # 调 user-svc 的断路器（与 AuthorEnrichService 上 @CircuitBreaker(name=...) 对应）
      user-svc-cb:
        # 失败统计：基于请求数量的滑动窗口，最近 10 次调用统计
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        # 失败率阈值 50% → 开启断路器
        failure-rate-threshold: 50
        # 慢调用：响应 > 800ms 算慢，慢调用率超过 50% 也开启
        slow-call-duration-threshold: 800ms
        slow-call-rate-threshold: 50
        # 开启状态持续 30s 后进入半开
        wait-duration-in-open-state: 30s
        # 半开状态允许 3 个探测请求
        permitted-number-of-calls-in-half-open-state: 3
        # 记录所有异常为失败（默认就是这样）
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.example.cloud.push: DEBUG

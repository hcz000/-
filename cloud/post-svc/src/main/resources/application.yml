server:
  port: 8082

spring:
  application:
    name: post-svc

  threads:
    virtual:
      enabled: true

  # ===== MySQL（与 user-svc 共享同一个数据库，临时方案，便于 Seata AT 演示）=====
  datasource:
    url: jdbc:mysql://localhost:3306/knowledgeplanet?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      pool-name: PostSvcHikariPool

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5s

  # ===== RabbitMQ（Outbox 投递目的地）=====
  rabbitmq:
    host: localhost
    port: 5672
    username: ${RABBITMQ_USERNAME:root}
    password: ${RABBITMQ_PASSWORD:123456}
    # 生产端可靠性：开启 publisher confirm，让 RabbitTemplate 知道 broker 是否收到
    publisher-confirm-type: correlated
    publisher-returns: true

  # Nacos 相关配置见 bootstrap.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# ===== Seata 客户端（账号注销的分支事务参与者）=====
seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: default_tx_group
  service:
    vgroup-mapping:
      default_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
    disable-global-transaction: false
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT

